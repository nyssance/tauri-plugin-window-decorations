name: Validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Full candidate commit SHA to validate
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        description: Immutable commit to validate
        required: false
        type: string

permissions: {}

concurrency:
  group: validation-${{ github.workflow }}-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-ref:
    name: Validate reusable-workflow input
    runs-on: ubuntu-24.04
    steps:
      - name: Require a full lowercase commit SHA
        shell: bash
        env:
          IMMUTABLE_REF: ${{ inputs.ref }}
        run: |
          if [[ -n "$IMMUTABLE_REF" && ! "$IMMUTABLE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "workflow input ref must be a full lowercase commit SHA" >&2
            exit 1
          fi

  native:
    name: ${{ matrix.os }} / Rust stable
    needs: validate-ref
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo add-apt-repository --yes universe
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Install Rust stable
        shell: bash
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: cargo +stable fmt --all -- --check

      - name: Run strict Clippy
        shell: bash
        run: |
          cargo +stable clippy --locked --all-targets --all-features -- -D warnings -D rust-2024-compatibility

      - name: Run Rust tests
        shell: bash
        run: |
          cargo +stable test --locked --all-features

      - name: Build documentation
        if: runner.os == 'Linux'
        shell: bash
        run: cargo +stable doc --locked --all-features --no-deps

  workflow-lint:
    name: Lint GitHub Actions workflows
    needs: validate-ref
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install verified actionlint
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output actionlint_1.7.12_linux_amd64.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          ./actionlint

  dependency-audit:
    name: RustSec advisory scan
    needs: validate-ref
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install Rust stable
        shell: bash
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-audit
        shell: bash
        run: cargo +stable install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        shell: bash
        run: |
          cargo audit

  package:
    name: Verify crate package
    needs: [native, workflow-lint, dependency-audit]
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install Rust stable
        shell: bash
        run: rustup toolchain install stable --profile minimal

      - name: Package and dry-run publication
        shell: bash
        run: |
          cargo +stable package --locked
          cargo +stable publish --dry-run --locked
