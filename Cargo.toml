[package]
name = "tauri-plugin-window-decorations"
version = "0.1.4"
authors = ["nyssance"]
description = "Native window controls, custom decorations, and Windows 11 Snap Layout for Tauri 3 desktop apps."
edition = "2021"
rust-version = "1.100"
include = [
    "/src/**/*.rs",
    "/src/**/*.js",
    "/src/**/*.css",
    "/permissions/**/*.toml",
    "/permissions/**/*.json",
    "/permissions/**/*.md",
    "/build.rs",
    "/README.md",
    "/docs/**/*.md",
    "/LICENSE",
]
links = "tauri-plugin-window-decorations"
license = "MIT"
repository = "https://github.com/nyssance/tauri-plugin-window-decorations"

[features]
default = []

[dependencies]
tauri = { version = "3.0.0-alpha.6", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1.52.3", features = ["sync", "time"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"

[build-dependencies]
tauri-plugin = { version = "3.0.0-alpha.1", features = ["build"] }
