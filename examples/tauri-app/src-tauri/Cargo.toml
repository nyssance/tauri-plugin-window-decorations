[package]
name = "tauri-app"
version = "0.0.0"
description = "Single-window example for tauri-plugin-window-decorations"
authors = ["oovz"]
license = "MIT"
repository = "https://github.com/oovz/tauri-plugin-window-decorations"
edition = "2021"
rust-version = "1.88"

[features]
default = []
e2e-wdio = [
    "dep:serde",
    "dep:tauri-plugin-wdio",
    "dep:tauri-plugin-wdio-webdriver",
]

[build-dependencies]
tauri-build = { version = "=2.5.5", default-features = false, features = [] }

[dependencies]
tauri = { version = "=2.10.0", default-features = false, features = ["wry"] }
tauri-plugin-window-decorations = { path = "../../../" }
serde = { version = "1.0", features = ["derive"], optional = true }
tauri-plugin-wdio = { version = "=1.2.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.2.0", optional = true }
