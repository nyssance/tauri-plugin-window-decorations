[package]
name = "tauri-app"
version = "0.0.0"
description = "Single-window example for tauri-plugin-window-decorations"
authors = ["nyssance"]
license = "MIT"
repository = "https://github.com/nyssance/tauri-plugin-window-decorations"
edition = "2021"
rust-version = "1.95"

[features]
default = []

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", default-features = false }

[dependencies]
tauri = { version = "=3.0.0-alpha.6", default-features = false }
tauri-plugin-window-decorations = { path = "../../../" }
